name: Build Toolchain

# WARNING: Do not declare permissions in this reusable workflow.
# Declare the required permissions in each calling job:
#   contents: read - required for all builds.

on:
  workflow_call:
    inputs:
      game:
        required: true
        type: string
        description: "Game to build (Generals, GeneralsMD)"
      preset:
        required: true
        type: string
        description: "CMake preset"
      tools:
        required: false
        default: true
        type: boolean
        description: "Build tools"
      extras:
        required: false
        default: false
        type: boolean
        description: "Build extras"
      ffmpeg:
        required: false
        default: false
        type: boolean
        description: "Build with FFmpeg support"
      tests:
        required: false
        default: false
        type: boolean
        description: "Build and run the tests"
      benchmarks:
        required: false
        default: false
        type: boolean
        description: "Build the benchmarks"

jobs:
  build:
    name: ${{ inputs.preset }}${{ inputs.tools && '+t' || '' }}${{ inputs.extras && '+e' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set Up Wine Build
        uses: ./.github/actions/setup-wine-build
        with:
          preset: ${{ inputs.preset }}

      - name: Cache vcpkg Binaries
        if: contains(inputs.preset, 'vcpkg')
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-wine-${{ runner.os }}-${{ runner.arch }}-${{ inputs.preset }}-${{ inputs.ffmpeg && 'ffmpeg' || 'base' }}-${{ hashFiles('vcpkg.json', '.github/scripts/*wine-build.sh', '.github/scripts/vcpkg-triplets/*.cmake', '.github/scripts/vcpkg-wine-toolchain.cmake') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-wine-${{ runner.os }}-${{ runner.arch }}-${{ inputs.preset }}-${{ inputs.ffmpeg && 'ffmpeg' || 'base' }}-${{ hashFiles('vcpkg.json', '.github/scripts/*wine-build.sh', '.github/scripts/vcpkg-triplets/*.cmake', '.github/scripts/vcpkg-wine-toolchain.cmake') }}-

      - name: Configure, Build and Test Under Wine
        env:
          PRESET: ${{ inputs.preset }}
          GAME: ${{ inputs.game }}
          BUILD_TOOLS: ${{ inputs.tools && 'ON' || 'OFF' }}
          BUILD_EXTRAS: ${{ inputs.extras && 'ON' || 'OFF' }}
          BUILD_FFMPEG: ${{ inputs.ffmpeg && 'ON' || 'OFF' }}
          BUILD_TESTS: ${{ inputs.tests && 'ON' || 'OFF' }}
          BUILD_BENCHMARKS: ${{ inputs.benchmarks && 'ON' || 'OFF' }}
          VCPKG_CACHE: ${{ runner.temp }}/vcpkg-cache
        run: xvfb-run -a bash .github/scripts/wine-build.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ inputs.game }}-${{ inputs.preset }}${{ inputs.tools && '+t' || '' }}${{ inputs.extras && '+e' || '' }}
          path: build/${{ inputs.preset }}/${{ inputs.game }}/artifacts
          retention-days: 30
          if-no-files-found: error
