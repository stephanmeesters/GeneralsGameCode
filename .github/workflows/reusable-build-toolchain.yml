name: Build Toolchain

# WARNING: Do not declare permissions in this reusable workflow.
# Declare the required permissions in each calling job:
#   contents: read - required for all builds.
#   packages: write - required for vcpkg binary-cache uploads only.

on:
  workflow_call:
    inputs:
      game:
        required: true
        type: string
        description: "Game to build (Generals, GeneralsMD)"
      preset:
        required: true
        type: string
        description: "CMake preset"
      tools:
        required: false
        default: true
        type: boolean
        description: "Build tools"
      extras:
        required: false
        default: false
        type: boolean
        description: "Build extras"
      ffmpeg:
        required: false
        default: false
        type: boolean
        description: "Build with FFmpeg support"
      tests:
        required: false
        default: false
        type: boolean
        description: "Build and run the tests"
      benchmarks:
        required: false
        default: false
        type: boolean
        description: "Build the benchmarks"

jobs:
  build:
    name: ${{ inputs.preset }}${{ inputs.tools && '+t' || '' }}${{ inputs.extras && '+e' || '' }}
    runs-on: windows-2022
    timeout-minutes: 30

    env:
      # Fork pull requests get a read-only GITHUB_TOKEN, so they restore from the
      # feed but must not attempt to upload to it.
      VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,${{ github.event.pull_request.head.repo.fork && 'read' || 'readwrite' }}"
      VCPKG_NUGET_REPOSITORY: "https://github.com/${{ github.repository }}.git"
      VCPKG_FEATURE_FLAGS: manifests,versions,binarycaching
      # Metrics make every vcpkg run open its own exe exclusively to copy itself into
      # TEMP for the telemetry upload, which randomly blocks the next vcpkg launch.
      VCPKG_DISABLE_METRICS: "1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache VC6 Installation
        if: startsWith(inputs.preset, 'vc6')
        id: cache-vc6
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: C:\VC6
          key: vc6-permanent-cache-v2

      - name: Cache CMake Dependencies
        id: cache-cmake-deps
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build\${{ inputs.preset }}\_deps
          key: cmake-deps-${{ inputs.preset }}-${{ hashFiles('CMakePresets.json','cmake/**/*.cmake','**/CMakeLists.txt') }}

      - name: Download VC6 Portable from itsmattkc repo
        if: ${{ startsWith(inputs.preset, 'vc6') && steps.cache-vc6.outputs.cache-hit != 'true' }}
        env:
          EXPECTED_HASH: "D0EE1F6DCEF7DB3AD703120D9FB4FAD49EBCA28F44372E40550348B1C00CA583"
          COMMIT: "001c4bafdcf2ef4b474d693acccd35a91e848f40"
        shell: pwsh
        run: |
          Write-Host "Downloading VC6 Portable Installation" -ForegroundColor Cyan
          Invoke-WebRequest -Uri https://github.com/itsmattkc/MSVC600/archive/$env:COMMIT.zip -OutFile VS6_VisualStudio6.zip

          Write-Host "Verifying File Integrity" -ForegroundColor Cyan
          $fileHash = (Get-FileHash -Path VS6_VisualStudio6.zip -Algorithm SHA256).Hash
          Write-Host "Downloaded file SHA256: $fileHash"
          Write-Host "Expected file SHA256: $env:EXPECTED_HASH"
          if ($fileHash -ne $env:EXPECTED_HASH) {
              Write-Error "Hash verification failed! File may be corrupted or tampered with."
              exit 1
          }

          Write-Host "Extracting Archive" -ForegroundColor Cyan
          & Expand-Archive -Path VS6_VisualStudio6.zip -DestinationPath C:\VC6
          Move-Item -Path C:\VC6\MSVC600-$env:COMMIT -Destination C:\VC6\VC6SP6
          Remove-Item VS6_VisualStudio6.zip -Verbose

      - name: Set Up VC6 Environment
        if: startsWith(inputs.preset, 'vc6')
        shell: pwsh
        run: |
          # Define the base directories as local variables first
          $VSCommonDir = "C:\VC6\VC6SP6\Common"
          $MSDevDir = "C:\VC6\VC6SP6\Common\msdev98"
          $MSVCDir = "C:\VC6\VC6SP6\VC98"
          $VcOsDir = "WINNT"

          # Set the variables in GitHub environment
          "VSCommonDir=$VSCommonDir" >> $env:GITHUB_ENV
          "MSDevDir=$MSDevDir" >> $env:GITHUB_ENV
          "MSVCDir=$MSVCDir" >> $env:GITHUB_ENV
          "VcOsDir=$VcOsDir" >> $env:GITHUB_ENV
          "PATH=$MSDevDir\BIN;$MSVCDir\BIN;$VSCommonDir\TOOLS\$VcOsDir;$VSCommonDir\TOOLS;$env:PATH" >> $env:GITHUB_ENV
          "INCLUDE=$MSVCDir\ATL\INCLUDE;$MSVCDir\INCLUDE;$MSVCDir\MFC\INCLUDE;$env:INCLUDE" >> $env:GITHUB_ENV
          "LIB=$MSVCDir\LIB;$MSVCDir\MFC\LIB;$env:LIB" >> $env:GITHUB_ENV

      - name: Set Up VC2022 Environment
        if: startsWith(inputs.preset, 'win32')
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x86

      - name: Setup vcpkg
        if: contains(inputs.preset, 'vcpkg')
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          runVcpkgInstall: false
          doNotCache: true

      - name: Configure NuGet Source for vcpkg Binary Cache
        if: contains(inputs.preset, 'vcpkg')
        shell: pwsh
        run: |
          $nuget = & "$env:VCPKG_ROOT\vcpkg.exe" fetch nuget | Select-Object -Last 1
          & $nuget sources add `
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "${{ github.repository_owner }}" `
            -Password "${{ secrets.GITHUB_TOKEN }}"
          & $nuget setapikey "${{ secrets.GITHUB_TOKEN }}" `
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          "VCPKG_INSTALL_OPTIONS=--x-abi-tools-use-exact-versions" >> $env:GITHUB_ENV

      - name: Configure ${{ inputs.game }} with CMake Using ${{ inputs.preset }}${{ inputs.tools && '+t' || '' }}${{ inputs.extras && '+e' || '' }} Preset
        shell: pwsh
        run: |
          $buildFlags = @(
            "-DRTS_BUILD_ZEROHOUR=${{ inputs.game == 'GeneralsMD' && 'ON' || 'OFF' }}",
            "-DRTS_BUILD_GENERALS=${{ inputs.game == 'Generals' && 'ON' || 'OFF' }}"
          )

          $gamePrefix = "${{ inputs.game == 'Generals' && 'GENERALS' || 'ZEROHOUR' }}"
          $buildFlags += "-DRTS_BUILD_CORE_TOOLS=${{ inputs.tools && 'ON' || 'OFF' }}"
          $buildFlags += "-DRTS_BUILD_${gamePrefix}_TOOLS=${{ inputs.tools && 'ON' || 'OFF' }}"
          $buildFlags += "-DRTS_BUILD_CORE_EXTRAS=${{ inputs.extras && 'ON' || 'OFF' }}"
          $buildFlags += "-DRTS_BUILD_${gamePrefix}_EXTRAS=${{ inputs.extras && 'ON' || 'OFF' }}"
          $buildFlags += "-DRTS_BUILD_OPTION_FFMPEG=${{ inputs.ffmpeg && 'ON' || 'OFF' }}"
          $buildFlags += "-DRTS_BUILD_OPTION_TESTS=${{ inputs.tests && 'ON' || 'OFF' }}"
          $buildFlags += "-DRTS_BUILD_OPTION_BENCHMARKS=${{ inputs.benchmarks && 'ON' || 'OFF' }}"

          Write-Host "Build flags: $($buildFlags -join ' | ')"
          cmake --preset ${{ inputs.preset }} $buildFlags

      - name: Build ${{ inputs.game }} with CMake Using ${{ inputs.preset }}${{ inputs.tools && '+t' || '' }}${{ inputs.extras && '+e' || '' }} Preset
        shell: pwsh
        run: |
          cmake --build --preset ${{ inputs.preset }}

      # The benchmarks are only built, because running them takes too long here.
      # Verbose prints the Google Test output, which lists the test cases of each executable.
      - name: Test ${{ inputs.game }} with CTest Using ${{ inputs.preset }}${{ inputs.tools && '+t' || '' }}${{ inputs.extras && '+e' || '' }} Preset
        if: ${{ inputs.tests }}
        shell: pwsh
        run: |
          ctest --preset ${{ inputs.preset }} --verbose

      # Keep this package separate from the game release artifacts. Only the plain
      # win32 Release build is needed for the Linux rendering job.
      - name: Package Rendering Tests
        if: ${{ inputs.tests && inputs.preset == 'win32' }}
        shell: pwsh
        run: |
          $testName = if ("${{ inputs.game }}" -eq "Generals") { "g_googletest" } else { "z_googletest" }
          $destination = New-Item -ItemType Directory -Force -Path "build/rendering-tests"
          Copy-Item "build/${{ inputs.preset }}/Tests/Google/Release/$testName.exe" $destination
          # Deploy the Release CRT beside the exe; Wine supplies the Windows/UCRT DLLs.
          $crtFiles = Get-ChildItem "$env:VCToolsRedistDir/x86/Microsoft.VC*.CRT/*.dll" -ErrorAction Stop
          if (!$crtFiles) { throw "MSVC x86 redistributable DLLs not found" }
          $crtFiles | Copy-Item -Destination $destination

      - name: Upload Rendering Test Executable
        if: ${{ inputs.tests && inputs.preset == 'win32' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ inputs.game }}-win32-rendering-tests
          path: build/rendering-tests
          retention-days: 7
          if-no-files-found: error

      - name: Collect ${{ inputs.game }} ${{ inputs.preset }}${{ inputs.tools && '+t' || '' }}${{ inputs.extras && '+e' || '' }} Artifact
        shell: pwsh
        run: |
          $buildDir = "build\${{ inputs.preset }}"
          $artifactsDir = New-Item -ItemType Directory -Force -Path "$buildDir\${{ inputs.game }}\artifacts" -Verbose

          if ("${{ inputs.preset }}" -like "win32*") {
            $configToUse = if ("${{ inputs.preset }}" -match "debug") { "Debug" } else { "Release" }
            $files = Get-ChildItem -Path "$buildDir\Core\$configToUse","$buildDir\${{ inputs.game }}\$configToUse" -File |
              Where-Object { $_.Extension -in @(".exe", ".dll", ".pdb") } -Verbose
          } else {
            $files = Get-ChildItem -Path "$buildDir\Core","$buildDir\${{ inputs.game }}" -File |
              Where-Object { $_.Extension -in @(".exe", ".dll", ".pdb") } -Verbose
          }

          $files | Move-Item -Destination $artifactsDir -Verbose -Force

      - name: Upload ${{ inputs.game }} ${{ inputs.preset }}${{ inputs.tools && '+t' || '' }}${{ inputs.extras && '+e' || '' }} Artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ inputs.game }}-${{ inputs.preset }}${{ inputs.tools && '+t' || '' }}${{ inputs.extras && '+e' || '' }}
          path: build\${{ inputs.preset }}\${{ inputs.game }}\artifacts
          retention-days: 30
          if-no-files-found: error

  rendering:
    name: Rendering with Wine and lavapipe
    needs: build
    if: ${{ inputs.tests && inputs.preset == 'win32' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download MSVC Rendering Tests
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ inputs.game }}-win32-rendering-tests
          path: build/rendering-tests

      - name: Install Wine and Software Vulkan
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            wine wine64 wine32:i386 xvfb xauth \
            libvulkan1 libvulkan1:i386 mesa-vulkan-drivers mesa-vulkan-drivers:i386

      - name: Download DXVK
        env:
          DXVK_VERSION: 2.6.2
          DXVK_SHA256: 17761876556afd55736cb895d184f5a1c55d43350f1b1e3b129f8d28706d7992
        run: |
          curl --fail --location --retry 3 --output build/dxvk.tar.gz \
            "https://github.com/doitsujin/dxvk/releases/download/v${DXVK_VERSION}/dxvk-${DXVK_VERSION}.tar.gz"
          echo "$DXVK_SHA256  build/dxvk.tar.gz" | sha256sum --check
          tar -C build -xf build/dxvk.tar.gz

      - name: Run Rendering Google Tests
        env:
          TEST_NAME: ${{ inputs.game == 'Generals' && 'g_googletest' || 'z_googletest' }}
        run: |
          Tests/Rendering/run-google-wine.sh \
            "build/rendering-tests/$TEST_NAME.exe" build/dxvk-2.6.2

      - name: Upload Rendering Results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ inputs.game }}-rendering-results
          path: |
            build/rendering-tests/*.bmp
            build/rendering-tests/*.log
            build/rendering-tests/results.xml
          retention-days: 7
          if-no-files-found: warn
