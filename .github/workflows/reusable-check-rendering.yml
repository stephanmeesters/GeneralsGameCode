name: Check Rendering

# WARNING: Do not declare permissions in this reusable workflow.
# Declare the required permissions in each calling job:
#   contents: read - required for rendering checks.
#   actions: read - required to download the rendering tests of the base commit.

on:
  workflow_call:
    inputs:
      game:
        required: true
        type: string
        description: "Game to check (Generals, GeneralsMD)"

jobs:
  rendering:
    name: Wine and lavapipe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DXVK_VERSION: 2.6.2
      GAME: ${{ inputs.game }}
      TEST_NAME: ${{ inputs.game == 'Generals' && 'g_googletest' || 'z_googletest' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download MSVC Rendering Tests
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ inputs.game }}-win32-rendering-tests
          path: build/rendering-tests

      - name: Install Wine and Software Vulkan
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            wine wine64 wine32:i386 xvfb xauth \
            libvulkan1 libvulkan1:i386 mesa-vulkan-drivers mesa-vulkan-drivers:i386

      - name: Download DXVK
        env:
          DXVK_SHA256: 17761876556afd55736cb895d184f5a1c55d43350f1b1e3b129f8d28706d7992
        run: |
          curl --fail --location --retry 3 --output build/dxvk.tar.gz \
            "https://github.com/doitsujin/dxvk/releases/download/v${DXVK_VERSION}/dxvk-${DXVK_VERSION}.tar.gz"
          echo "$DXVK_SHA256  build/dxvk.tar.gz" | sha256sum --check
          tar -C build -xf build/dxvk.tar.gz

      - name: Run Rendering Google Tests
        run: |
          .github/scripts/run-rendering-tests-wine.sh \
            "build/rendering-tests/$TEST_NAME.exe" "build/dxvk-${DXVK_VERSION}"

      - name: Download Base Rendering Tests
        id: base
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
        run: |
          # Compare with the commit this change is based on: the previous main commit for a push,
          # otherwise the merge base with main. Its GenCI run already built the rendering tests.
          case "$GITHUB_EVENT_NAME" in
            push) base=$PUSH_BEFORE ;;
            pull_request) base=$(gh api "repos/$GITHUB_REPOSITORY/compare/$PR_BASE...$PR_HEAD_OWNER:$PR_HEAD" --jq .merge_base_commit.sha) || base="" ;;
            *) base=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .merge_base_commit.sha) || base="" ;;
          esac
          # A commit has no package when it was pushed together with later commits, or when its run
          # skipped this game's build because nothing it builds from changed. The nearest ancestor
          # with a package then renders the same.
          commits=""
          if [ -n "$base" ]; then
            commits=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=$base&per_page=20" --jq '.[].sha') || commits=""
          fi
          for commit in $commits; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$commit" \
              --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id") || runs=""
            for run in $runs; do
              if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$GAME-win32-rendering-tests" \
                --dir build/rendering-tests-base; then
                echo "Using the rendering tests of run $run for commit $commit (base commit $base)"
                echo "sha=$commit" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              rm -rf build/rendering-tests-base
            done
          done
          echo "::notice title=Rendering::No rendering tests found for base commit ${base:-unknown}, so the images are not compared"

      - name: Run Base Rendering Google Tests
        if: ${{ always() && steps.base.outputs.sha }}
        run: |
          .github/scripts/run-rendering-tests-wine.sh \
            "build/rendering-tests-base/$TEST_NAME.exe" "build/dxvk-${DXVK_VERSION}" ||
            echo "::warning title=Rendering::The base rendering tests failed, so only the images they wrote are compared"

      # Differences are warnings in the report and job summary; reviewers decide if they are intended.
      - name: Compare Rendering with Base
        if: always()
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          python3 .github/scripts/compare-rendering.py "$GAME" build/rendering-tests build/rendering-tests-base \
            "$BASE_SHA" "build/$GAME-rendering-report.html"

      # An unzipped artifact opens directly in the browser.
      - name: Upload Rendering Report
        id: report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: build/${{ inputs.game }}-rendering-report.html
          archive: false
          retention-days: 7
          if-no-files-found: warn

      - name: Link Rendering Report
        if: ${{ always() && steps.report.outputs.artifact-url }}
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          echo "[Open the $GAME rendering report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Rendering Results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ inputs.game }}-rendering-results
          path: |
            build/rendering-tests/*.bmp
            build/rendering-tests/*.log
            build/rendering-tests/results.xml
          retention-days: 7
          if-no-files-found: warn
