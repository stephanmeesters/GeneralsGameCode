name: Check Replays

# WARNING: Do not declare permissions in this reusable workflow.
# Declare the required permissions in each calling job:
#   contents: read - required for replay checks.

on:
  workflow_call:
    inputs:
      game:
        required: true
        type: string
        description: "Game to check (only GeneralsMD for now)"
      userdata:
        required: true
        type: string
        description: "Path to folder with replays and maps"
      preset:
        required: true
        type: string
        description: "CMake preset"

jobs:
  build:
    name: ${{ inputs.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - name: Download Game Artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ inputs.game }}-${{ inputs.preset }}
          path: build

      - name: Install Proton Dependencies
        run: |
          echo "GAME_PATH=$RUNNER_TEMP/GameData" >> "$GITHUB_ENV"
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine wine32:i386 wine64 winbind winetricks xvfb file cabextract p7zip-full libvulkan1 libvulkan1:i386
          pipx install protontricks==1.12.1
          pipx inject protontricks setuptools==80.9.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Proton Download
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ runner.temp }}/replay-steam/compatibilitytools.d
          key: replay-proton-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/check-replays-proton.sh') }}

      - name: Cache Game Data
        id: cache-gamedata
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ env.GAME_PATH }}
          key: gamedata-linux-v1

      - name: Download Game Data from Cloudflare R2
        if: steps.cache-gamedata.outputs.cache-hit != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: bash .github/scripts/download-replay-data.sh

      - name: Run Replay Compatibility Tests with Proton and VC6 Runtime
        env:
          GAME: ${{ inputs.game }}
          USERDATA: ${{ inputs.userdata }}
        run: xvfb-run -a bash .github/scripts/check-replays-proton.sh

      - name: Upload Replay Logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: Replay-Debug-Log-${{ inputs.preset }}
          path: |
            build/DebugLogFile*.txt
            build/stdout.log
            build/stderr.log
          retention-days: 30
          if-no-files-found: ignore
